name: ETL Pipeline CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-smoke-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (pytest)
        run: python -m pytest -v

      - name: Run Pandas pipeline dry-run smoke test
        run: |
          python -m src.pipeline --engine pandas --generate-if-missing --skip-db-load --customers-count 1000 --orders-count 2500 --activity-count 2000

      - name: Run PySpark pipeline dry-run smoke test
        run: |
          python -m src.pipeline --engine pyspark --generate-if-missing --skip-db-load --customers-count 1000 --orders-count 2500 --activity-count 2000
